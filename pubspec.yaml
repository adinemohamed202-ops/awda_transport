name: awda_transport
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <3.12.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🌐 HTTP (للربط مع السيرفر)
  http: ^1.6.0

  # 📸 الصور
  image_picker: ^1.2.1

  # 🔊 الصوت
  flutter_sound: ^9.30.0
  permission_handler: ^12.0.1
  audioplayers: ^5.2.1

  # 📷 QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.7

  # 💾 تخزين محلي
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/notification.mp3
    - assets/icon/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"